<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Verify your identity | AgapAlert</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .otp-wrap {
      display: flex;
      gap: 0.5rem;
      justify-content: center;
      margin: 1.5rem 0 0.5rem;
    }
    .otp-digit {
      width: 48px;
      height: 56px;
      text-align: center;
      font: 700 24px 'IBM Plex Mono', monospace;
      border: 2px solid var(--line-s);
      border-radius: 8px;
      background: var(--bg2);
      color: var(--text);
      caret-color: var(--accent);
      outline: none;
      transition: border-color 0.15s;
    }
    .otp-digit:focus { border-color: var(--accent); }
    .otp-hint {
      font-size: 13px;
      color: var(--text-3);
      text-align: center;
      margin: 0 0 1.5rem;
    }
    .otp-hint strong { color: var(--text-2); }
  </style>
</head>
<body class="auth-page">

<main class="auth">
  <section class="auth-brand">
    <a class="brand" href="login.html">
      <img src="assets/img/logo.png" alt="" width="36" height="36">AgapAlert
    </a>
    <div>
      <h1>Two-step <em>verification</em></h1>
      <p>We sent a 6-digit code to your email to confirm it's really you.</p>
    </div>
  </section>

  <section class="auth-form">
    <div class="auth-card">
      <h2>Enter verification code</h2>

      <div id="otp-error" class="notice notice-error" role="alert" style="display:none"></div>

      <div class="otp-wrap" id="otp-inputs">
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]" autocomplete="one-time-code">
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]">
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]">
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]">
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]">
        <input class="otp-digit" type="text" inputmode="numeric" maxlength="1" pattern="[0-9]">
      </div>

      <p class="otp-hint" id="otp-hint">Check your email for the code. It expires in <strong>10 minutes</strong>.</p>

      <button class="btn btn-primary btn-block" id="otp-submit" type="button">Verify</button>

      <p class="auth-alt" style="margin-top:1rem">
        <a href="login.html">← Back to sign in</a>
      </p>
    </div>
  </section>
</main>

<script>
(function () {
  // Read otp_token and email hint from sessionStorage (set by google-auth.js)
  var otpToken   = sessionStorage.getItem('agapalert_otp_token');
  var emailHint  = sessionStorage.getItem('agapalert_otp_email');
  var isNew      = sessionStorage.getItem('agapalert_otp_isnew') === '1';

  if (!otpToken) {
    // No token — redirect back to login
    window.location.href = 'login.html';
    return;
  }

  if (emailHint) {
    document.getElementById('otp-hint').innerHTML =
      'A code was sent to <strong>' + emailHint + '</strong>. It expires in <strong>10 minutes</strong>.';
  }

  // ── OTP input wiring ────────────────────────────────────────────────────────
  var inputs = Array.from(document.querySelectorAll('.otp-digit'));

  inputs.forEach(function (inp, i) {
    inp.addEventListener('input', function () {
      // Allow only digits
      inp.value = inp.value.replace(/\D/g, '');
      if (inp.value && i < inputs.length - 1) inputs[i + 1].focus();
      if (inputs.every(function (d) { return d.value; })) submitOtp();
    });

    inp.addEventListener('keydown', function (e) {
      if (e.key === 'Backspace' && !inp.value && i > 0) inputs[i - 1].focus();
    });

    inp.addEventListener('paste', function (e) {
      var paste = (e.clipboardData || window.clipboardData).getData('text').replace(/\D/g, '');
      if (paste.length === 6) {
        paste.split('').forEach(function (ch, j) { if (inputs[j]) inputs[j].value = ch; });
        inputs[5].focus();
        submitOtp();
      }
      e.preventDefault();
    });
  });

  inputs[0].focus();

  // ── Submit ──────────────────────────────────────────────────────────────────
  document.getElementById('otp-submit').addEventListener('click', submitOtp);

  function submitOtp() {
    var code    = inputs.map(function (d) { return d.value; }).join('');
    var errorEl = document.getElementById('otp-error');
    var btn     = document.getElementById('otp-submit');

    if (code.length < 6) {
      errorEl.textContent  = 'Please enter all 6 digits.';
      errorEl.style.display = '';
      return;
    }

    errorEl.style.display = 'none';
    btn.disabled    = true;
    btn.textContent = 'Verifying…';

    fetch('api/auth/verify-otp.php', {
      method:      'POST',
      credentials: 'same-origin',
      headers:     { 'Content-Type': 'application/json' },
      body:        JSON.stringify({ otp_token: otpToken, otp: code }),
    })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        btn.disabled    = false;
        btn.textContent = 'Verify';

        if (!data.ok) {
          errorEl.textContent   = data.error || 'Incorrect code. Please try again.';
          errorEl.style.display = '';
          inputs.forEach(function (d) { d.value = ''; });
          inputs[0].focus();
          return;
        }

        // Clear session storage
        sessionStorage.removeItem('agapalert_otp_token');
        sessionStorage.removeItem('agapalert_otp_email');
        sessionStorage.removeItem('agapalert_otp_isnew');

        localStorage.setItem('agapalert_user', JSON.stringify(data.user));
        localStorage.setItem('agapalert_flash', JSON.stringify({
          type:    'success',
          message: isNew ? 'Account created. Welcome to AgapAlert!' : 'Signed in. Welcome back!',
        }));

        window.location.href = 'index.html';
      })
      .catch(function () {
        btn.disabled    = false;
        btn.textContent = 'Verify';
        errorEl.textContent   = 'Could not reach the server. Check your connection.';
        errorEl.style.display = '';
      });
  }
}());
</script>
</body>
</html>
